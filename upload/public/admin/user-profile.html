<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - MEHRAB GAMING BD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: #f3f6fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 900px; margin: auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 18px; margin-top: 0; }
    .panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px #0000000a;
      overflow-wrap: anywhere;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .item {
      background: #f5f7fb;
      padding: 12px;
      border-radius: 8px;
    }
    .item small { display: block; color: #64748b; margin-bottom: 5px; }
    .item strong { overflow-wrap: anywhere; }
    .record {
      border-bottom: 1px solid #e8edf4;
      padding: 12px 0;
    }
    .record:last-child { border-bottom: 0; }
    button {
      border: 0;
      padding: 10px 14px;
      border-radius: 8px;
      background: #172554;
      color: white;
      cursor: pointer;
    }
    #message { margin: 12px 0; color: #475569; }
    .empty { color: #64748b; }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>ব্যবহারকারীর সম্পূর্ণ প্রোফাইল</h1>
      <button id="backButton" type="button">← ব্যবহারকারী তালিকা</button>
    </header>

    <p id="message">প্রোফাইল লোড হচ্ছে...</p>

    <section class="panel">
      <h2>অ্যাকাউন্টের তথ্য</h2>
      <div id="accountInfo" class="grid"></div>
    </section>

    <section class="panel">
      <h2>ওয়ালেটের তথ্য</h2>
      <div id="walletInfo" class="grid"></div>
      <h3>ওয়ালেট লেনদেন</h3>
      <div id="walletHistory"></div>
    </section>

    <section class="panel">
      <h2>অর্ডারের ইতিহাস</h2>
      <div id="orders"></div>
    </section>

    <section class="panel">
      <h2>টুর্নামেন্টের ইতিহাস</h2>
      <div id="tournaments"></div>
    </section>

    <section class="panel">
      <h2>লগইনের ইতিহাস</h2>
      <div id="loginHistory"></div>
    </section>

    <section class="panel">
      <h2>নোটিফিকেশন</h2>
      <div id="notifications"></div>
    </section>

    <section class="panel">
      <h2>সাপোর্ট টিকিট</h2>
      <div id="supportTickets"></div>
    </section>
  </main>

  <script src="user-profile.js"></script>
</body>
</html>
