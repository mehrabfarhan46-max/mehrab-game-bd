
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Likes Management - MEHRAB GAMING BD</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f6fc;
      color: #202536;
      font-family: Arial, sans-serif;
    }

    .site-header {
      background: #111827;
      padding: 17px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .site-header .logo {
      color: white;
      font-size: 19px;
      font-weight: 800;
      text-decoration: none;
    }

    .site-header .logo span {
      color: #60a5fa;
    }

    .site-header nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .site-header nav a {
      color: #e5e7eb;
      text-decoration: none;
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 13px;
    }

    .site-header nav a:hover,
    .site-header nav a.active {
      background: #1769d2;
      color: white;
    }

    .admin-likes {
      width: 92%;
      max-width: 1100px;
      margin: 35px auto;
    }

    .page-heading {
      background: linear-gradient(135deg, #1769d2, #3995f6);
      color: white;
      padding: 28px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 6px 20px rgba(23, 105, 210, 0.15);
    }

    .page-heading h1 {
      margin: 0 0 9px;
      font-size: 27px;
    }

    .page-heading p {
      margin: 0;
      color: #eaf3ff;
      font-size: 14px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr);
      gap: 22px;
      align-items: start;
    }

    .likes-form,
    .likes-list {
      background: white;
      border: 1px solid #e3eaf4;
      border-radius: 14px;
      padding: 23px;
      box-shadow: 0 4px 16px rgba(25, 50, 90, 0.05);
      min-width: 0;
    }

    .section-title {
      margin: 0 0 7px;
      font-size: 19px;
      color: #17243a;
    }

    .section-subtitle {
      color: #8490a3;
      font-size: 13px;
      margin: 0 0 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #46536a;
    }

    .likes-form input {
      display: block;
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d8e1ed;
      border-radius: 8px;
      background: #fbfcff;
      color: #202536;
      font-size: 14px;
      outline: none;
    }

    .likes-form input:focus {
      border-color: #1769d2;
      box-shadow: 0 0 0 3px rgba(23, 105, 210, 0.1);
    }

    .admin-button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .admin-button:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .primary-button {
      background: #1769d2;
      color: white;
    }

    .secondary-button {
      background: #e9f1fc;
      color: #1769d2;
    }

    .likes-form .admin-button {
      width: 100%;
      margin-top: 8px;
    }

    .likes-form #cancelLikesEdit {
      background: #edf0f5;
      color: #475569;
    }

    .likes-message {
      margin: 13px 0 0;
      font-size: 13px;
    }

    .list-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    #adminLikesList {
      margin-top: 15px;
    }

    .admin-like-card {
      border: 1px solid #e3eaf4;
      background: #fbfcff;
      border-radius: 11px;
      padding: 17px;
      margin-top: 12px;
    }

    .admin-like-card button {
      margin: 8px 6px 0 0;
      padding: 9px 14px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .edit-like {
      background: #1769d2;
      color: white;
    }

    .status-like {
      background: #e8f1ff;
      color: #1769d2;
    }

    .back-link {
      display: inline-block;
      margin: 25px 0;
      color: #1769d2;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    @media (max-width: 750px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }

      .admin-likes {
        width: 94%;
        margin: 22px auto;
      }

      .page-heading {
        padding: 23px 18px;
      }

      .page-heading h1 {
        font-size: 23px;
      }

      .likes-form,
      .likes-list {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a class="logo" href="../index.html">
      MEHRAB <span>GAMING BD</span>
    </a>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="packages.html">Diamonds Management</a>
      <a href="likes.html" class="active">Likes Management</a>
    </nav>
  </header>

  <main class="admin-likes">

    <section class="page-heading">
      <h1>Likes Management</h1>
      <p>Manage, add and update your Likes packages from one place.</p>
    </section>

    <div class="admin-grid">

      <section class="likes-form">
        <h2 class="section-title" id="formTitle">Add Likes Package</h2>
        <p class="section-subtitle">
          Enter package information below.
        </p>

        <form id="likesForm">

          <div class="form-group">
            <label for="name_en">Package Name (English)</label>
            <input type="text" id="name_en"
              placeholder="Example: Facebook Likes" required maxlength="150">
          </div>

          <div class="form-group">
            <label for="name_bn">Package Name (Bangla)</label>
            <input type="text" id="name_bn"
              placeholder="প্যাকেজের বাংলা নাম" maxlength="150">
          </div>

          <div class="form-group">
            <label for="platform">Platform</label>
            <input type="text" id="platform"
              placeholder="Example: Facebook" maxlength="100">
          </div>

          <div class="form-group">
            <label for="quantity">Likes Quantity</label>
            <input type="number" id="quantity"
              placeholder="Enter quantity" min="1" required>
          </div>

          <div class="form-group">
            <label for="price">Price (৳)</label>
            <input type="number" id="price"
              placeholder="Enter price" min="0" step="0.01" required>
          </div>

          <button class="admin-button primary-button"
            type="submit" id="saveLikesButton">
            Add Package
          </button>

          <button type="button" id="cancelLikesEdit"
            class="admin-button" hidden>
            Cancel Edit
          </button>

        </form>

        <p id="likesMessage" class="likes-message"></p>
      </section>

      <section class="likes-list">

        <div class="list-heading">
          <div>
            <h2 class="section-title">All Likes Packages</h2>
            <p class="section-subtitle">View and manage existing packages.</p>
          </div>

          <button class="admin-button secondary-button"
            type="button" id="refreshLikesButton">
            ↻ Refresh
          </button>
        </div>

        <div id="adminLikesList">
          Loading packages...
        </div>

      </section>

    </div>

    <a class="back-link" href="dashboard.html">
      ← Back to Admin Dashboard
    </a>

  </main>

  <script src="likes.js"></script>

</body>
</html>
