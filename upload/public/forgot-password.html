
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - MEHRAB GAMING BD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #080d18;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: #111b2d;
      border: 1px solid #263750;
      border-radius: 18px;
      box-shadow: 0 15px 40px #0008;
    }

    .logo {
      text-align: center;
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .logo span {
      color: #fbbf24;
    }

    h2 {
      text-align: center;
      margin: 22px 0 10px;
    }

    .subtitle {
      color: #aab7ca;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #35465f;
      outline: none;
      background: #0a1220;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #fbbf24;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 9px;
      background: #fbbf24;
      color: #111827;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: #263750;
      color: white;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: #fca5a5;
    }

    .back {
      display: block;
      text-align: center;
      color: #fbbf24;
      margin-top: 22px;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">MEHRAB <span>GAMING BD</span></div>

    <h2>Forgot Password?</h2>
    <p class="subtitle">
      Enter your registered email to reset your password.
    </p>

    <form id="forgotForm">
      <section id="emailSection">
        <label for="email">Registered Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
        <button type="submit" id="sendButton">
          Send OTP
        </button>
      </section>

      <section id="otpSection" class="hidden">
        <label for="otp">Email OTP</label>
        <input
          type="text"
          id="otp"
          inputmode="numeric"
          maxlength="6"
          placeholder="Enter 6-digit OTP"
        >

        <button type="button" id="verifyButton">
          Verify OTP
        </button>

        <button type="button" class="secondary" id="resendButton">
          Resend OTP
        </button>
      </section>

      <section id="passwordSection" class="hidden">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          minlength="8"
          placeholder="Enter new password"
        >

        <label for="confirmPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          minlength="8"
          placeholder="Enter password again"
        >

        <button type="button" id="resetButton">
          Reset Password
        </button>
      </section>
    </form>

    <p id="message"></p>

    <a href="login.html" class="back">← Back to Login</a>
  </main>

  <script src="forgot-password.js"></script>
</body>
</html>
