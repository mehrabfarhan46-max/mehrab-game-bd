
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Home - MEHRAB GAMING BD</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #10131b;
      color: #fff;
      font-family: Arial, sans-serif;
      padding-bottom: 85px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 16px;
      background: #191e2a;
    }

    .logo {
      font-size: 17px;
      font-weight: 800;
    }

    .logo span { color: #f5b942; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-button {
      border: 1px solid #343b4c;
      background: #252c3b;
      color: white;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 17px;
      cursor: pointer;
    }

    .wallet {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #343b4c;
      background: #252c3b;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: bold;
    }

    main { padding: 18px 15px; }

    .banner {
      position: relative;
      height: 175px;
      overflow: hidden;
      border-radius: 17px;
      background: linear-gradient(120deg, #283c61, #6b3c42);
      display: flex;
      align-items: center;
      padding: 22px;
      margin-bottom: 25px;
      transition: background 0.5s ease;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .banner-content {
      pointer-events: none;
      position: relative;
      z-index: 1;
    }

    .banner h1 {
      font-size: 25px;
      margin: 0 0 9px;
    }

    .banner p {
      margin: 0;
      color: #e0e5ef;
      font-size: 14px;
    }

    .banner-dots {
      position: absolute;
      bottom: 13px;
      right: 18px;
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff70;
    }

    .dot.active {
      background: white;
      width: 19px;
      border-radius: 8px;
    }

    .section-title {
      font-size: 20px;
      margin: 0 0 14px;
    }

    .help-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .help-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 12px;
      background: #1b2230;
      border: 1px solid #30394b;
      border-radius: 14px;
      font-weight: bold;
      font-size: 14px;
    }

    .help-icon { font-size: 24px; }

    .game-card {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border-radius: 16px;
      background: #1b2230;
      border: 1px solid #343d50;
    }

    .game-image {
      width: 75px;
      height: 75px;
      flex-shrink: 0;
      border-radius: 12px;
      background: #30394b;
      display: grid;
      place-items: center;
      font-size: 34px;
    }

    .game-info { flex: 1; }

    .game-info h3 {
      margin: 0 0 7px;
      font-size: 17px;
    }

    .game-info p {
      margin: 0;
      color: #aeb8ca;
      font-size: 13px;
    }

    .open-arrow {
      font-size: 25px;
      color: #f5b942;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #191e2a;
      border-top: 1px solid #343b4c;
      z-index: 5;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #aeb8ca;
      font-size: 12px;
    }

    .nav-item.active { color: #f5b942; }
    .nav-icon { font-size: 21px; }
  </style>
</head>

<body>

  <header class="header">
    <a class="logo" href="index.html">
      MEHRAB <span>GAMING BD</span>
    </a>

    <div class="header-actions">
      <button
        class="icon-button"
        id="notificationButton"
        aria-label="Notifications"
      >🔔</button>

      <a class="wallet" href="profile.html" aria-label="Wallet">
        💰 <span id="walletBalance">৳0</span>
      </a>
    </div>
  </header>

  <main>

    <section class="banner" id="banner">
      <div class="banner-content">
        <h1 id="bannerTitle">FREE FIRE TOURNAMENT</h1>
        <p id="bannerText">
          Join matches and play with your team.
        </p>
      </div>

      <div class="banner-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </section>

    <section>
      <h2 class="section-title">Need Any Help?</h2>

      <div class="help-grid">
        <a class="help-card" href="#" id="whatsappLink">
          <span class="help-icon">🟢</span>
          <span>WhatsApp Help</span>
        </a>

        <a class="help-card" href="#" id="telegramLink">
          <span class="help-icon">✈️</span>
          <span>Telegram Help</span>
        </a>
      </div>
    </section>

    <section>
      <h2 class="section-title">Games</h2>

      <a class="game-card" href="tournament-categories.html">
        <div class="game-image">🎮</div>

        <div class="game-info">
          <h3>Free Fire Matches</h3>
          <p>Explore categories and join matches</p>
        </div>

        <span class="open-arrow">›</span>
      </a>
    </section>

  </main>

  <nav class="bottom-nav">
    <a class="nav-item active" href="tournaments.html">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>

    <a class="nav-item" href="profile.html">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    const banners = [
      {
        title: "FREE FIRE TOURNAMENT",
        text: "Join matches and play with your team.",
        background: "linear-gradient(120deg, #283c61, #6b3c42)"
      },
      {
        title: "SHOW YOUR SKILLS",
        text: "Find a match and compete with players.",
        background: "linear-gradient(120deg, #24534d, #30436e)"
      },
      {
        title: "READY TO PLAY?",
        text: "Explore Free Fire match categories.",
        background: "linear-gradient(120deg, #593b70, #9a563c)"
      }
    ];

    let bannerIndex = 0;
    let slideTimer = null;
    let touchStartX = 0;
    let touchStartY = 0;

    const banner = document.getElementById("banner");

    function showBanner() {
      const item = banners[bannerIndex];

      document.getElementById("bannerTitle").textContent = item.title;
      document.getElementById("bannerText").textContent = item.text;
      banner.style.background = item.background;

      document.querySelectorAll(".dot").forEach((dot, index) => {
        dot.classList.toggle("active", index === bannerIndex);
      });
    }

    function nextBanner() {
      bannerIndex = (bannerIndex + 1) % banners.length;
      showBanner();
    }

    function previousBanner() {
      bannerIndex = (bannerIndex - 1 + banners.length) % banners.length;
      showBanner();
    }

    function restartAutoSlide() {
      clearInterval(slideTimer);
      slideTimer = setInterval(nextBanner, 3500);
    }

    banner.addEventListener("touchstart", function(event) {
      touchStartX = event.changedTouches[0].screenX;
      touchStartY = event.changedTouches[0].screenY;
    }, { passive: true });

    banner.addEventListener("touchend", function(event) {
      const touchEndX = event.changedTouches[0].screenX;
      const touchEndY = event.changedTouches[0].screenY;

      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;

      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 0) {
          nextBanner();
        } else {
          previousBanner();
        }

        restartAutoSlide();
      }
    }, { passive: true });

    showBanner();
    restartAutoSlide();

    document
      .getElementById("notificationButton")
      .addEventListener("click", function() {
        alert("No new notifications.");
      });

    try {
      const profile = JSON.parse(
        sessionStorage.getItem("playerProfile") || "null"
      );

      if (profile && profile.wallet_balance !== undefined) {
        document.getElementById("walletBalance").textContent =
          "৳" + profile.wallet_balance;
      }
    } catch (error) {
      console.log("Wallet balance is not available yet.");
    }
  </script>

</body>
</html>
